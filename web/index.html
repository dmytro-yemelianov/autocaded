<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#222228">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AutoCADED">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>AutoCADED — AutoCAD-86 1.40 (1983) in WebAssembly</title>
  <style>
    :root {
      --bg-dark: #121214;
      --bg-panel: #1a1a1e;
      --bg-bar: #222228;
      --border-color: #33333d;
      --text-main: #e0e0e0;
      --text-dim: #888899;
      --accent-green: #00ff66;
      --accent-red: #ff5555;
      --font-mono: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      /* The visible viewport, kept current by JS so the command line stays
         above an on-screen keyboard; dvh is the fallback. */
      height: var(--app-height, 100dvh);
      padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    header {
      background: var(--bg-bar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: calc(6px + env(safe-area-inset-top)) 14px 6px;
      gap: 8px 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    header button {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 10px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      min-width: 40px;
      min-height: 32px;
    }

    header button.on {
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    /* Touch controls: keyboard, Return, Esc and zoom, for devices without
       a physical keyboard or wheel. */
    #touch-bar {
      display: none;
      gap: 6px;
    }

    @media (hover: none), (pointer: coarse) {
      #touch-bar { display: flex; }
      select { min-height: 32px; }
    }

    /* The on-screen keyboard's target: focusable but invisible. 16px stops
       iOS zooming into it. */
    #soft-keys {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      font-size: 16px;
      border: 0;
      padding: 0;
    }

    @media (max-width: 640px) {
      header { padding-left: 8px; padding-right: 8px; }
      h1 { font-size: 14px; }
      select { flex: 1 1 0; min-width: 0; padding: 5px 6px; }
      #message { flex-basis: 100%; order: 10; margin-left: 0; }
      #message:empty { display: none; }
    }

    h1 {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
    }

    h1 span {
      color: var(--accent-green);
    }

    select {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }

    select:hover {
      background: #2a2a34;
      border-color: #555566;
    }

    #message {
      margin-left: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #message.error {
      color: var(--accent-red);
    }

    input[type="file"] {
      display: none;
    }

    main {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000000;
    }

    #cad-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      image-rendering: pixelated;
      touch-action: none;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(18, 18, 20, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: var(--font-mono);
      font-size: 14px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(0, 255, 102, 0.2);
      border-top-color: var(--accent-green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header>
    <h1>AutoCAD<span>ED</span></h1>

    <select id="open-select" title="Open a DWG/DXF drawing (or drop one on the page)">
      <option value="">Open…</option>
      <option value="file">From computer…</option>
      <optgroup id="sample-group" label="Samples" hidden></optgroup>
    </select>
    <input type="file" id="file-input" accept=".dwg,.dxf,.bak">

    <select id="save-select" title="Download the current drawing">
      <option value="">Save as…</option>
      <option value="dwg">DWG (AC1.40)</option>
      <option value="dxf">DXF</option>
      <option value="svg">SVG</option>
      <option value="png">PNG</option>
    </select>

    <select id="palette-select" title="How colour numbers are drawn">
      <option value="pc16">PC 16-colour (1983)</option>
      <option value="aci256">ACI 256 (modern)</option>
    </select>

    <div id="touch-bar">
      <button id="btn-keys" title="On-screen keyboard">Keys</button>
      <button id="btn-return" title="Return">⏎</button>
      <button id="btn-esc" title="Cancel (Esc)">Esc</button>
      <button id="btn-zoom-in" title="Zoom in">＋</button>
      <button id="btn-zoom-out" title="Zoom out">－</button>
    </div>

    <span id="message"></span>
  </header>
  <input id="soft-keys" type="text" value=" " autocomplete="off" autocorrect="off"
    autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Command input">

  <!-- The engine draws its own command area and screen menu on the canvas;
       keyboard input goes straight to it. -->
  <main>
    <canvas id="cad-canvas"></canvas>
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div>Loading AutoCADED WebAssembly...</div>
    </div>
  </main>

  <script type="module">
    import init, { AutoCadSession } from './pkg/acad_wasm.js';

    const canvas = document.getElementById('cad-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const overlay = document.getElementById('loading-overlay');
    const messageEl = document.getElementById('message');
    let cad = null;
    // Base name for downloads: the opened drawing's, without extension.
    let drawingName = 'drawing';

    // assets/manifest.json (written by scripts/build-wasm.sh) names the font,
    // screen menu and sample drawings: AutoCADED's own demo set, or a local
    // AutoCAD 1.4 corpus.
    let assets = { font: null, menu: null, samples: [], start: null };

    function message(text, isError = false) {
      messageEl.textContent = text;
      messageEl.title = text;
      messageEl.classList.toggle('error', isError);
    }

    function redraw() {
      if (!cad || canvas.width === 0 || canvas.height === 0) return;
      try {
        const rgba = cad.render_rgba(canvas.width, canvas.height);
        const pixels = new Uint8ClampedArray(rgba.buffer, rgba.byteOffset, rgba.byteLength);
        ctx.putImageData(new ImageData(pixels, canvas.width, canvas.height), 0, 0);
      } catch (err) {
        console.error('render error:', err);
      }
    }

    // Canvas pixels per CSS pixel. The engine draws its menu and command
    // line at a fixed pixel size, so narrow screens render finer: the screen
    // menu then takes about a third of a phone's width, not half.
    function pixelRatio() {
      const narrow = Math.min(window.innerWidth, window.innerHeight) < 600;
      return narrow ? Math.min(window.devicePixelRatio || 1, 1.5) : 1;
    }

    function resizeCanvas() {
      const container = canvas.parentElement;
      const ratio = pixelRatio();
      // Follow the box exactly: a floor above it would push the engine's
      // command line under a landscape phone's on-screen keyboard.
      const w = Math.max(Math.round(container.clientWidth * ratio), 100);
      const h = Math.max(Math.round(container.clientHeight * ratio), 100);
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w;
        canvas.height = h;
        redraw();
      }
    }

    // Rotation, window resizing and the on-screen keyboard all change the
    // canvas box; the visual viewport is what stays visible above a keyboard.
    new ResizeObserver(resizeCanvas).observe(canvas.parentElement);
    function fitViewport() {
      const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty('--app-height', `${Math.round(height)}px`);
    }
    fitViewport();
    window.visualViewport?.addEventListener('resize', fitViewport);
    window.addEventListener('resize', fitViewport);
    window.addEventListener('orientationchange', () => setTimeout(fitViewport, 300));

    async function fetchAsset(name) {
      const res = await fetch(`./assets/${name}`);
      if (!res.ok) throw new Error(`assets/${name}: HTTP ${res.status} (run scripts/build-wasm.sh)`);
      return new Uint8Array(await res.arrayBuffer());
    }

    function openBytes(bytes, name) {
      try {
        cad.open_auto(bytes);
        fitToScreen();
        drawingName = name.replace(/\.[^.]*$/, '') || 'drawing';
        message(`Opened ${name}`);
      } catch (err) {
        message(`Cannot open ${name}: ${err}`, true);
      }
      redraw();
    }

    async function start() {
      try {
        await init();
        cad = new AutoCadSession(window.innerWidth || 800, window.innerHeight || 600);
        resizeCanvas();
        try {
          assets = { ...assets, ...JSON.parse(new TextDecoder().decode(await fetchAsset('manifest.json'))) };
        } catch (err) {
          // No staged assets: the engine still runs with an empty drawing.
        }
        const group = document.getElementById('sample-group');
        for (const sample of assets.samples) {
          group.append(new Option(sample.label || sample.file, sample.file));
        }
        group.hidden = assets.samples.length === 0;
        const missing = [];
        const tryLoad = async (name, use) => {
          if (!name) return;
          let bytes;
          try { bytes = await fetchAsset(name); } catch (err) { missing.push(name); return; }
          try { use(bytes); } catch (err) { message(`Failed to load assets/${name}: ${err}`, true); }
        };
        await tryLoad(assets.font, (bytes) => cad.load_font('TXT', bytes));
        await tryLoad(assets.menu, (bytes) => cad.load_menu(bytes));
        await tryLoad(assets.start, (bytes) => {
          cad.open_auto(bytes);
          fitToScreen();
          drawingName = assets.start.replace(/\.[^.]*$/, '');
        });
        redraw();
        overlay.style.display = 'none';
        if (missing.length) {
          message(`Missing assets/${missing.join(', assets/')}`, true);
        }
      } catch (err) {
        overlay.innerHTML = `<div style="color:var(--accent-red)">Initialization error: ${err}</div>`;
      }
    }

    function key(name) {
      if (!cad) return;
      try {
        cad.key_down(name, false, false, false);
      } catch (err) {
        // A rejected command is already reported in the command area.
      }
      redraw();
    }

    // Keyboard goes to the engine's command area, as in the native window.
    const softKeys = document.getElementById('soft-keys');
    window.addEventListener('keydown', (e) => {
      if (!cad || e.isComposing || e.target === softKeys) return;
      // A focused, closed Open/Save list would treat typing as type-ahead
      // ("S" picks SVG and downloads it); the keys belong to the command area.
      if (e.target instanceof HTMLSelectElement) e.target.blur();
      // Leave browser shortcuts alone; Ctrl+C is AutoCAD's cancel.
      if (e.ctrlKey || e.metaKey) {
        if (e.ctrlKey && (e.key === 'c' || e.key === 'C')) {
          cad.key_down(e.key, true, e.altKey, e.metaKey);
          redraw();
          e.preventDefault();
        }
        return;
      }
      try {
        if (cad.key_down(e.key, false, e.altKey, false)) e.preventDefault();
      } catch (err) {
        // A rejected command is already reported in the command area.
      }
      redraw();
    });

    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      return [
        (e.clientX - rect.left) * (canvas.width / rect.width),
        (e.clientY - rect.top) * (canvas.height / rect.height),
      ];
    }

    // A saved view is a centre and a height; on a screen narrower than the
    // drawing's, show the whole drawing instead of a cropped middle.
    function fitToScreen() {
      try {
        cad.command('ZOOM');
        cad.command('E');
        cad.command('ZOOM');
        cad.command('0.9X');
      } catch (err) {
        // An empty drawing has no extents; keep its view.
      }
    }

    // Press and release, not click: SKETCH draws while the button is held.
    // Capture keeps the release (and motion) coming if the drag leaves the canvas.
    canvas.addEventListener('pointerdown', (e) => {
      if (!cad || e.button !== 0) return;
      canvas.setPointerCapture(e.pointerId);
      const [x, y] = canvasPoint(e);
      try {
        cad.press(x, y, canvas.width, canvas.height);
      } catch (err) {
        // Reported in the command area.
      }
      redraw();
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!cad || e.button !== 0) return;
      const [x, y] = canvasPoint(e);
      try {
        cad.release(x, y, canvas.width, canvas.height);
      } catch (err) {
        // Reported in the command area.
      }
      redraw();
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!cad) return;
      const [x, y] = canvasPoint(e);
      try {
        cad.motion(x, y, canvas.width, canvas.height);
        cad.cursor(x, y);
      } catch (err) {
        // Reported in the command area.
      }
      redraw();
    });

    // Wheel and zoom buttons zoom relative to the current view (`nX`; a bare
    // number is relative to the whole drawing), only when they cannot
    // interleave with a command in progress.
    function zoom(factor) {
      if (!cad) return;
      const state = JSON.parse(cad.get_state_json());
      if (state.prompt !== 'Command' || state.input || state.report_visible) return;
      try {
        cad.command('ZOOM');
        cad.command(`${factor}X`);
      } catch (err) {
        // Reported in the command area.
      }
      redraw();
    }
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      zoom(e.deltaY < 0 ? 1.2 : 0.8);
    }, { passive: false });

    // On-screen keyboard: a hidden input holds one sentinel space, so every
    // keystroke, Backspace included, shows up as a change to its value.
    const SENTINEL = ' ';
    const keysButton = document.getElementById('btn-keys');
    function resetSoftKeys() {
      softKeys.value = SENTINEL;
      // Caret after the sentinel: typing appends, Backspace deletes it.
      softKeys.setSelectionRange(SENTINEL.length, SENTINEL.length);
    }
    function feedSoftKeys() {
      const value = softKeys.value;
      if (value.length < SENTINEL.length) {
        key('Backspace');
      } else {
        // Wherever the caret was, the typed text is the value minus one sentinel.
        const at = value.indexOf(SENTINEL);
        const typed = at < 0 ? value : value.slice(0, at) + value.slice(at + SENTINEL.length);
        for (const ch of typed) key(ch);
      }
      resetSoftKeys();
    }
    softKeys.addEventListener('input', (e) => { if (!e.isComposing) feedSoftKeys(); });
    softKeys.addEventListener('compositionend', feedSoftKeys);
    softKeys.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === 'Escape') {
        e.preventDefault();
        key(e.key);
      }
    });
    softKeys.addEventListener('focus', () => {
      keysButton.classList.add('on');
      resetSoftKeys();
    });
    softKeys.addEventListener('blur', () => keysButton.classList.remove('on'));
    // Touch buttons act without taking focus, so an open keyboard stays open.
    for (const [id, action] of [
      ['btn-keys', () => (document.activeElement === softKeys ? softKeys.blur() : softKeys.focus())],
      ['btn-return', () => key('Enter')],
      ['btn-esc', () => key('Escape')],
      ['btn-zoom-in', () => zoom(1.5)],
      ['btn-zoom-out', () => zoom(0.67)],
    ]) {
      const button = document.getElementById(id);
      button.addEventListener('pointerdown', (e) => e.preventDefault());
      button.addEventListener('click', action);
    }

    // Open: local file or a staged sample.
    const fileInput = document.getElementById('file-input');
    document.getElementById('open-select').addEventListener('change', async (e) => {
      const val = e.target.value;
      e.target.value = '';
      e.target.blur();
      if (!val || !cad) return;
      if (val === 'file') {
        fileInput.click();
        return;
      }
      try {
        openBytes(await fetchAsset(val), val);
      } catch (err) {
        message(String(err), true);
      }
    });

    async function openFile(file) {
      if (file && cad) openBytes(new Uint8Array(await file.arrayBuffer()), file.name);
    }

    fileInput.addEventListener('change', () => {
      openFile(fileInput.files && fileInput.files[0]);
      fileInput.value = '';
    });

    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      openFile(e.dataTransfer.files && e.dataTransfer.files[0]);
    });

    // Save: write the chosen format under the open drawing's name.
    const EXPORTS = {
      dwg: { type: 'application/octet-stream', label: 'AutoCAD 1.4 drawing', data: () => cad.export_dwg('1.4') },
      dxf: { type: 'application/dxf', label: 'AutoCAD 1.4 DXF', data: () => cad.export_dxf() },
      svg: { type: 'image/svg+xml', label: 'SVG image', data: () => cad.export_svg(1024, 768) },
      png: { type: 'image/png', label: 'PNG image', data: () => cad.render_png(canvas.width, canvas.height) },
    };

    // The save dialog names the file explicitly. An <a download> link is the
    // fallback: some browsers and embedded views ignore its name and save the
    // blob under its UUID with no extension.
    async function save(blob, filename, ext, label) {
      if (window.showSaveFilePicker) {
        let handle;
        try {
          handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{ description: label, accept: { [blob.type]: [`.${ext}`] } }],
          });
        } catch (err) {
          if (err.name === 'AbortError') return false;
          handle = null; // Picker unavailable here (e.g. an iframe): fall back.
        }
        if (handle) {
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return true;
        }
      }
      const url = URL.createObjectURL(new File([blob], filename, { type: blob.type }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60_000);
      return true;
    }

    document.getElementById('save-select').addEventListener('change', async (e) => {
      const ext = e.target.value;
      e.target.value = '';
      e.target.blur();
      if (!ext || !cad) return;
      const filename = `${drawingName}.${ext}`;
      try {
        const { type, label, data } = EXPORTS[ext];
        // Build the bytes first: the picker must open while the change event
        // still counts as user activation.
        if (await save(new Blob([data()], { type }), filename, ext, label)) {
          message(`Saved ${filename}`);
        }
      } catch (err) {
        message(`${ext.toUpperCase()} export failed: ${err}`, true);
      }
    });

    // Palette: a per-viewer preference, remembered when storage allows.
    const paletteSelect = document.getElementById('palette-select');
    function applyPalette(name) {
      try {
        cad.set_palette(name);
        paletteSelect.value = name;
      } catch (err) {
        message(String(err), true);
      }
      redraw();
    }
    paletteSelect.addEventListener('change', () => {
      if (!cad) return;
      applyPalette(paletteSelect.value);
      try { localStorage.setItem('autocaded.palette', paletteSelect.value); } catch (err) { /* private mode */ }
      paletteSelect.blur();
    });

    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('./sw.js').catch((err) => console.warn('offline cache:', err));
    }

    start().then(() => {
      let saved = null;
      try { saved = localStorage.getItem('autocaded.palette'); } catch (err) { /* private mode */ }
      if (cad && saved && saved !== paletteSelect.value) applyPalette(saved);
    });
  </script>
</body>
</html>
