[workspace]
members = ["crates/acad-model", "crates/acad-corpus", "crates/acad-dxf", "crates/acad-dwg", "crates/acad-render", "crates/acad-cmd", "crates/acad-app", "crates/acad-re", "crates/acad-oracle"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
acad-model = { path = "crates/acad-model" }
acad-dxf = { path = "crates/acad-dxf" }
acad-dwg = { path = "crates/acad-dwg" }
acad-render = { path = "crates/acad-render" }

# The interactive QEMU runner scales fullscreen frames per poll; unoptimized
# builds take most of a frame interval to do it.
[profile.dev.package.acad-oracle]
opt-level = 2
