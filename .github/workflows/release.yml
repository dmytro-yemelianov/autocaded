name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, raps-ci, autorust]
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Environment PATH (self-hosted)
        if: runner.os == 'Linux'
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain (GitHub-hosted)
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release -p acad-app --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          stage="autorust-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/acad" "dist/${stage}/"
          cp "target/${{ matrix.target }}/release/acad-mcp" "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          stage="autorust-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/acad.exe" "dist/${stage}/"
          cp "target/${{ matrix.target }}/release/acad-mcp.exe" "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/"
          cd dist
          7z a "${stage}.zip" "${stage}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autorust-${{ matrix.target }}
          path: dist/*.${{ matrix.archive_ext }}

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: [self-hosted, raps-ci, autorust]
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-artifacts

      - name: Collect release bundles & generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          find raw-artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-dist/ \;
          cd release-dist
          sha256sum * > SHA256SUMS
          echo "=== Release Artifacts ==="
          ls -lh
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
