name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Build release binaries
        shell: bash
        run: |
          cargo build --release -p acad-app --target ${{ matrix.target }}

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          stage="autocaded-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/acad" "dist/${stage}/"
          cp "target/${{ matrix.target }}/release/acad-mcp" "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          stage="autocaded-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${stage}"
          cp "target/${{ matrix.target }}/release/acad.exe" "dist/${stage}/"
          cp "target/${{ matrix.target }}/release/acad-mcp.exe" "dist/${stage}/"
          cp README.md LICENSE "dist/${stage}/"
          cd dist
          7z a "${stage}.zip" "${stage}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autocaded-${{ matrix.target }}
          path: dist/*.${{ matrix.archive_ext }}

  wasm:
    name: build (wasm32 web bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/[^0-9.]/, ""); print; exit }' Cargo.lock)"
          mkdir -p "$RUNNER_TEMP/wasm-bindgen"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" -o "$RUNNER_TEMP/wasm-bindgen.tar.gz"
          tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" --strip-components=1 -C "$RUNNER_TEMP/wasm-bindgen"
          echo "$RUNNER_TEMP/wasm-bindgen" >> "$GITHUB_PATH"

      # AutoCADED's own font, menu and drawings (demo/); no Autodesk files.
      - name: Build web bundle
        run: ./scripts/build-wasm.sh --assets demo

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          stage="autocaded-${tag}-wasm"
          mkdir -p "dist/${stage}/pkg"
          cp web/index.html web/input.mjs web/manifest.webmanifest web/sw.js web/icon.svg web/*.png "dist/${stage}/"
          cp web/pkg/acad_wasm.js web/pkg/acad_wasm_bg.wasm "dist/${stage}/pkg/"
          cp -R web/assets "dist/${stage}/assets"
          cp README.md LICENSE "dist/${stage}/"
          tar -C dist -czf "dist/${stage}.tar.gz" "${stage}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: autocaded-wasm
          path: dist/*.tar.gz

  macos_app:
    name: build (universal macOS app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build and verify app bundle
        shell: bash
        run: |
          export AUTOCADED_BUNDLE_VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-macos-app.sh
          mkdir -p dist
          cp target/macos/AutoCADED-macOS.zip "dist/autocaded-${GITHUB_REF_NAME}-universal-apple-darwin.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: autocaded-macos-app
          path: dist/*.zip

  release:
    name: Create GitHub Release
    needs: [build, wasm, macos_app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-artifacts

      - name: Collect release bundles & generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          find raw-artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-dist/ \;
          cd release-dist
          sha256sum -- * > SHA256SUMS
          echo "=== Release Artifacts ==="
          ls -lh
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
