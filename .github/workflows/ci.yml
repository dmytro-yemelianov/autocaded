name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify & Test Gate (raps-ci)
    runs-on: [self-hosted, raps-ci, autorust]
    steps:
      - uses: actions/checkout@v4

      - name: Environment & Toolchain PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          rustc --version && cargo --version
          lean --version && lake --version

      - name: Format
        run: cargo fmt --all --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Browser regressions
        run: node --test tools/tests/web_*.test.mjs

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (wasm32, acad-wasm)
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy -p acad-wasm --target wasm32-unknown-unknown -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude acad-oracle

      - name: Formal proofs (Lean 4)
        run: |
          cd formal
          lake build

      - name: Oracle tests (skip visibly without System.img/QEMU)
        run: |
          cargo test -p acad-oracle -- --nocapture 2>&1 | tee oracle.log || true
          skips=$(grep -cE 'skipping|SKIP ' oracle.log || true)
          echo "::notice title=acad-oracle::${skips} oracle skip messages (System.img, corpus files or qemu-system-i386 absent)"

      - name: Release build (acad, acad-mcp)
        run: cargo build --release -p acad-app
