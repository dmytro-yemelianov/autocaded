[package]
name = "acad-app"
default-run = "acad"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "acad"
path = "src/main.rs"

[dependencies]
acad-dwg.workspace = true
acad-dxf.workspace = true
acad-cmd = { path = "../acad-cmd" }
acad-model.workspace = true
acad-render.workspace = true
winit = "0.30"
softbuffer = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
png = "0.17"
